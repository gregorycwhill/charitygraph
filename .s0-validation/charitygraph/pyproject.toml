[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charitygraph"
version = "0.1.0"
description = "Local production engine for CharityGraph"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
document-evaluation = [
  "pymupdf>=1.28,<2",
  "camelot-py>=2,<3",
  "rapidocr-onnxruntime>=1.2,<2",
]

[project.scripts]
charitygraph = "charitygraph.cli:main"
causebase = "charitygraph.cli:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/charitygraph", "src/causebase_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
